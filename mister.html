<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@700;800&display=swap"><link rel="stylesheet" href="style.css"><meta name="robots" content="noindex,nofollow"><title>Sala técnica</title></head><body class="m">
<div class="top"><b>Sala técnica</b><select id="sel" aria-label="Elegir sesión"></select><button id="clk">▶ Cronómetro</button><button onclick="print()">Imprimir / PDF</button></div>
<header class="hero" id="hero"></header><main id="app"></main>
<script src="datos-jugador.js"></script><script src="datos-mister.js"></script><script src="board.js"></script>
<script>
const L=a=>"<ul>"+a.map(x=>"<li>"+x+"</li>").join("")+"</ul>",M=MISTER.slice().reverse();
let T=null;
M.forEach((m,i)=>{const j=JUGADOR.find(x=>x.id==m.id)||{fecha:m.id,titulo:m.id};sel.add(new Option(j.fecha+": "+j.titulo,i))});
function show(n){clearInterval(T);T=null;clk.textContent="▶ Cronómetro";const m=M[n],j=JUGADOR.find(x=>x.id==m.id)||{fecha:m.id,titulo:m.id,anims:{}};
const mins=m.fases.map(f=>+f.min.match(/\d+(?=\D*$)/)[0]);
hero.innerHTML='<p class="kick">Lo que he visto · '+j.fecha+'</p><h1>'+j.titulo+'</h1><p class="lead">'+m.observacion+'</p><p class="lead"><b>Objetivo:</b> '+m.objetivo+'</p>';
app.innerHTML='<div class="seg">'+m.fases.map((f,i)=>'<span style="flex:'+mins[i]+'">'+f.n.split(":")[0]+' · '+mins[i]+"′</span>").join("")+'</div>'+
m.fases.map((f,i)=>'<article class="fase"><div class="mn"><b>'+f.min+'</b><span>min</span></div><div><h3>'+f.n+'</h3><p class="sub">'+f.t+'</p><p>'+f.d+'</p>'+L(f.reglas)+'<div class="bs"></div></div></article>').join("")+
'<div class="sock"><h2>Feedback socrático</h2><p>Preguntas para los parones:</p>'+L(m.preguntas)+'</div><h2>Qué mirar para saber si funciona</h2>'+L(m.senales)+
'<div class="prompt"><h2>Mi próxima idea</h2><p>Escribe lo que has visto y copia el mensaje para pedirme la siguiente ficha.</p><textarea id="idea" placeholder="Ej.: tras recuperar el balón se paran a mirar"></textarea><br><button id="cp">Copiar mensaje para Claude</button></div>';
const F=app.querySelectorAll(".fase"),G=app.querySelectorAll(".seg span");
m.fases.forEach((f,i)=>{const a=f.anim&&(m.anims[f.anim]||j.anims[f.anim]);if(a){const b=document.createElement("div");F[i].querySelector(".bs").append(b);Board(b,a)}});
cp.onclick=()=>{const t="Soy el míster de un Infantil de 2º año de fútbol sala (4 jugadores de campo y portero). Esto es lo que he visto: "+idea.value+"\nGenérame una sesión nueva con el mismo formato que mis archivos datos-jugador.js y datos-mister.js, con pizarras animadas, fechada hoy.";
try{navigator.clipboard.writeText(t);cp.textContent="¡Copiado! Pégalo en Claude"}catch(e){idea.value=t}};
let f=0,s=0;const paint=()=>{clk.textContent="⏱ "+String(s/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0")+" · fase "+(f+1);F.forEach((e,i)=>e.classList.toggle("on",i==f));G.forEach((e,i)=>e.classList.toggle("on",i==f))};
const beep=()=>{try{const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.start();o.stop(c.currentTime+.4)}catch(e){}};
clk.onclick=()=>{if(T){clearInterval(T);T=null;clk.textContent="▶ Cronómetro";return}f=0;s=mins[0]*60;paint();F[0].scrollIntoView({behavior:"smooth"});
T=setInterval(()=>{if(--s<0){beep();if(++f>=mins.length){clearInterval(T);T=null;clk.textContent="✔ Sesión terminada";return}s=mins[f]*60;F[f].scrollIntoView({behavior:"smooth"})}paint()},1000)}}
sel.onchange=()=>show(+sel.value);show(0);
</script></body></html>
